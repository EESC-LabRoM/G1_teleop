services:
  teleop:
    build: .
    image: h_g1-teleop
    container_name: h_g1_teleop
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./src:/workspace/src
    stdin_open: true
    tty: true
    command: >
      bash -c "source /opt/ros/humble/setup.bash && source /ros_ws/install/setup.bash &&
               cd /workspace && colcon build --symlink-install &&
               source install/setup.bash &&
               ros2 launch g1_teleop g1_wrist_realsense.launch.py"
